name: release

# 보호 태그 v* push에서만 돕니다. 태그 v*는 저장소 소유자만 만들고 옮기고 지울 수 있게 ruleset으로 보호합니다.
on:
  push:
    tags:
      - 'v*'

permissions: {}

defaults:
  run:
    shell: bash

env:
  ARCHIVE_PREFIX: logbook
  OFFICIAL_KIND: module
  OFFICIAL_ID: app.dhoport.logbook
  # DHO Navigator 공식 서명 공개 키(키 ID 08e8baf4d8fc20b2). 서명 확인은 이 값으로만 합니다.
  OFFICIAL_PUBLIC_KEY: RWQI6Lr02PwgsuFqqQVCM+2eMg68tMD9zZf6RQb3D5OPPObVNWdUr4kC
  # .github/tools/는 DHO Navigator 2.2.1 공개 Module 도구(dho-module-node-tools.zip의 tools/)를 그대로 옮긴 사본입니다.
  # 아래 SHA-256과 다르면 두 job 모두 멈춥니다. 도구를 바꿀 때는 파일과 이 목록을 같은 커밋에서 함께 바꿉니다.
  TOOL_SHA256SUMS: |
    cb62ce89e1a0fa109fe995153642b3e80e83bae0958f6b93f31d5184927cf63a  module-tool-bundle.mjs
    e75c06ae8e05a0cf44599786c8cd659f38a0d8f63d2129ce6b7848851fe84974  official-module.mjs
    250412b1d24d8c0ecdb5af90c1732e95040add12b850c2fd1f29e4983315022b  validate-module.mjs
    244d6e64aea25b90b4113034e063af914da45db41d227ec737516987e65f1ab2  build-module.mjs
    b35e9c7e1d6b8e508155d8f7df2a0df3c68c971ff908ec7a7a032382fb1c15d9  verify-module.mjs

jobs:
  # 비밀값 없이 저장소 코드를 검사하고 서명 전 archive를 만듭니다.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: 태그와 manifest 버전 확인
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('module/manifest.json','utf8')).version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "태그 ${GITHUB_REF_NAME}와 manifest 버전 v${version}이 다릅니다." >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: 로직 검사
        run: node --test test/

      - name: 고정 도구 확인
        working-directory: .github/tools
        run: printf '%s' "$TOOL_SHA256SUMS" | sha256sum --check --strict -

      - name: 검증과 빌드
        run: |
          tools=.github/tools
          handoff="$RUNNER_TEMP/handoff"
          name="${ARCHIVE_PREFIX}-${VERSION}.dho-module"
          mkdir -p "$handoff/dist" "$handoff/tools"
          node "$tools/validate-module.mjs" module
          node "$tools/build-module.mjs" module "$handoff/dist/$name"
          node "$tools/verify-module.mjs" "$handoff/dist/$name"
          (cd "$handoff/dist" && sha256sum "$name" > unsigned.sha256 && cat unsigned.sha256)
          cp "$tools"/*.mjs "$handoff/tools/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff
          path: ${{ runner.temp }}/handoff/
          if-no-files-found: error
          retention-days: 1

  # 저장소 checkout·의존성·저장소 스크립트 없이 build 산출물과 고정 도구만으로 서명합니다.
  sign:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: handoff
          path: ${{ runner.temp }}/handoff

      - name: 서명 도구와 산출물 확인
        run: |
          cd "$RUNNER_TEMP/handoff"
          node --version
          (cd tools && printf '%s' "$TOOL_SHA256SUMS" | sha256sum --check --strict -)
          expected="$(printf '%s' "$TOOL_SHA256SUMS" | grep -c .)"
          actual="$(find tools -type f | wc -l)"
          if [ "$expected" != "$actual" ]; then
            echo "tools 파일 수가 ${actual}개로 고정 목록 ${expected}개와 다릅니다." >&2
            exit 1
          fi
          name="${ARCHIVE_PREFIX}-${GITHUB_REF_NAME#v}.dho-module"
          (cd dist && sha256sum --check --strict unsigned.sha256)
          test -f "dist/$name"
          echo "ARCHIVE_NAME=$name" >> "$GITHUB_ENV"

      - name: 이미 만든 Release 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/handoff"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME}이 이미 있어 서명하지 않습니다." >&2
            exit 1
          fi

      # 비밀 키는 이 step의 env로만 넘깁니다. 출력하지 않습니다.
      - name: 공식 서명
        env:
          DHO_OFFICIAL_SECRET_KEY: ${{ secrets.DHO_OFFICIAL_SECRET_KEY }}
        run: |
          cd "$RUNNER_TEMP/handoff"
          mkdir -p release
          node tools/official-module.mjs sign "dist/$ARCHIVE_NAME" "release/$ARCHIVE_NAME"

      - name: 서명 확인
        run: |
          cd "$RUNNER_TEMP/handoff"
          node tools/official-module.mjs verify "release/$ARCHIVE_NAME" --public-key "$OFFICIAL_PUBLIC_KEY"
          expected="trusted comment: dho-navigator-official-archive-v1 ${OFFICIAL_KIND} ${OFFICIAL_ID} ${GITHUB_REF_NAME#v}"
          actual="$(unzip -p "release/$ARCHIVE_NAME" dho-official.sig | sed -n 3p)"
          if [ "$actual" != "$expected" ]; then
            echo "서명의 kind·id·version이 태그와 다릅니다: ${actual}" >&2
            exit 1
          fi
          (cd release && sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256" && cat "$ARCHIVE_NAME.sha256")

      - name: Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/handoff"
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Logbook ${GITHUB_REF_NAME}" \
            --notes "항해 일지. DHO Navigator 2.2.1 이상에서 설치하세요. 공식 서명이 들어 있는 파일이므로 다시 압축하거나 내용을 바꾸면 설치되지 않습니다."
